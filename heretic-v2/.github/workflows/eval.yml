name: eval
on: [pull_request]
jobs:
  avaliar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: node eval/run.mjs cand
        env: { BASE: "${{ secrets.PREVIEW_URL }}", N: "2" }
      - run: node eval/compare.mjs base cand
